name: jsDelivr 캐시 자동 갱신
# main 에 푸시될 때마다, 바뀐 파일 + admin.js(안전망)의 jsDelivr 캐시를 지웁니다.
# 커밋하면 끝. (다만 브라우저는 별개 — 페이지에선 하드 리프레시 필요)

on:
  push:
    branches: [main]
  workflow_dispatch:      # Actions 탭에서 수동 실행 버튼

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: 변경 파일 + admin.js 캐시 갱신
        run: |
          set -u
          # 1) 이번 푸시의 추가/수정 파일 (null 안전 — ? 로 에러 방지)
          CHANGED="$(jq -r '[.commits[]? | (.added[]?, .modified[]?)] | unique | .[]' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
          # 2) admin.js 는 항상 포함(안전망) + 중복 제거 + 빈 줄 제거
          FILES="$(printf '%s\nadmin.js\n' "$CHANGED" | sort -u | sed '/^$/d')"

          echo "── purge 대상 ──"; echo "$FILES"; echo "───────────────"

          echo "$FILES" | while IFS= read -r f; do
            [ -z "$f" ] && continue
            url="https://purge.jsdelivr.net/gh/${{ github.repository }}@main/${f}"
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
            echo "purge → $f  (HTTP $code)"
          done

          echo "완료. 30초~1분 뒤부터 새 버전. (페이지에선 하드 리프레시 필요)"
